name: Unit Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    uses: ./.github/workflows/python_check.yml
    with:
      job_name: Unit tests
      command: uv run pytest
      runner: ${{ matrix.os }}
      # installed-browsers pins pywin32<311, which has no Windows CPython 3.14 wheel.
      matrix_exclude: >-
        ${{ matrix.os == 'windows-latest' && '[{"python-version": "3.14"}]' || '[]' }}
