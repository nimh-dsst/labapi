name: Unit Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    uses: ./.github/workflows/python_check.yml
    with:
      job_name: Unit tests (${{ matrix.os }})
      command: uv run pytest
      runner: ${{ matrix.os }}
      # installed-browsers pins pywin32<311, which has no Windows CPython 3.14 wheel.
      python_versions: ${{ matrix.os == 'windows-latest' && '["3.10", "3.11", "3.12", "3.13"]' || '["3.10", "3.11", "3.12", "3.13", "3.14"]' }}
