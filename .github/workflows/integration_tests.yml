name: Integration Test Suite

on:
  workflow_dispatch:
    inputs:
      la_key:
        description: LabArchives Authentication Token
        required: true
        type: string
      la_email:
        description: LabArchives Authentication la_email
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        version: "latest"

    - name: Set up Python
      run: uv python install 3.10

    - name: Install dependencies
      run: uv sync --all-groups

    - name: Mask transient authentication inputs
      run: |
        auth_key="$(jq -r '.inputs.la_key' "$GITHUB_EVENT_PATH")"
        auth_email="$(jq -r '.inputs.la_email' "$GITHUB_EVENT_PATH")"
        echo "::add-mask::$auth_key"
        echo "::add-mask::$auth_email"

    - name: Run tests with pytest
      env:
        API_URL: ${{ secrets.API_URL }}
        ACCESS_KEYID: ${{ secrets.AKID }}
        ACCESS_PWD: ${{ secrets.AKPASS }}
        AUTH_KEY: ${{ github.event.inputs.la_key }}
        AUTH_EMAIL: ${{ github.event.inputs.la_email }}
        NOTEBOOK: ${{ secrets.NOTEBOOK }}
      run: uv run pytest --integration tests/test_integration.py
