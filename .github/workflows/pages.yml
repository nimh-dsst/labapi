name: Pages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    env:
      # Older release tags import typing.Self and typing.override.
      UV_PYTHON: "3.12"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Keep only the current release candidate docs
        run: |
          git tag --list 'v*rc*' |
            grep -vxF "$GITHUB_REF_NAME" |
            xargs --no-run-if-empty git tag --delete

      - name: Build versioned Sphinx docs
        run: uv run sphinx-multiversion docs/source docs/_build/html

      - name: Add Pages root files
        run: |
          set -eu
          latest="$(find docs/_build/html -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [ -z "$latest" ]; then
            echo "No versioned docs directories found." >&2
            exit 1
          fi

          touch docs/_build/html/.nojekyll
          # Release candidates are versioned only; the default always stays final.
          cp -r "docs/_build/html/${latest}" docs/_build/html/latest
          cat > docs/_build/html/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=./${latest}/index.html">
            <link rel="canonical" href="./${latest}/index.html">
            <title>Redirecting...</title>
          </head>
          <body>
            <p>Redirecting to <a href="./${latest}/index.html">${latest}</a>.</p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    name: Deploy docs site
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
