name: Python Check

on:
  workflow_call:
    inputs:
      job_name:
        required: true
        type: string
      command:
        required: true
        type: string
      runner:
        required: false
        type: string
        default: ubuntu-latest
      append_python_version_arg:
        required: false
        type: boolean
        default: false
      python_versions:
        required: false
        type: string
        default: '["3.11", "3.12", "3.13", "3.14"]'
      # JSON list of matrix combinations to drop, e.g. '[{"python-version": "3.14"}]'.
      matrix_exclude:
        required: false
        type: string
        default: '[]'

jobs:
  check:
    name: ${{ inputs.job_name }} (Python ${{ matrix.python-version }})
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python_versions) }}
        exclude: ${{ fromJSON(inputs.matrix_exclude) }}
    env:
      # Without this, `uv sync` and `uv run` follow .python-version, not the matrix.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: Run check
        run: ${{ inputs.command }}${{ inputs.append_python_version_arg && format(' --python-version {0}', matrix.python-version) || '' }}
