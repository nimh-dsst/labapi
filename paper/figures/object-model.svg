<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="470" fill="white"/>

  <!-- connection / session band -->
  <rect x="250" y="26" width="90" height="38" rx="6" fill="#eeeeee" stroke="#333"/>
  <text x="295" y="50" text-anchor="middle" font-family="monospace" font-size="15">Client</text>
  <rect x="370" y="26" width="90" height="38" rx="6" fill="#eeeeee" stroke="#333"/>
  <text x="415" y="50" text-anchor="middle" font-family="monospace" font-size="15">User</text>
  <line x1="340" y1="45" x2="368" y2="45" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="355" y="80" text-anchor="middle" font-size="11" fill="#555">connection, signing, session</text>
  <line x1="415" y1="64" x2="515" y2="116" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- column headers -->
  <text x="150" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">LabArchives concept</text>
  <text x="540" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">labapi class</text>

  <!-- left column (concepts) -->
  <g fill="#dbe9f6" stroke="#333">
    <rect x="70" y="118" width="160" height="44" rx="6"/>
    <rect x="70" y="188" width="160" height="44" rx="6"/>
    <rect x="70" y="258" width="160" height="44" rx="6"/>
    <rect x="70" y="330" width="160" height="66" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="15" fill="#123">
    <text x="150" y="145">Notebook</text>
    <text x="150" y="215">Folder</text>
    <text x="150" y="285">Page</text>
    <text x="150" y="368">Entry</text>
  </g>

  <!-- right column (classes) -->
  <g fill="#dff0df" stroke="#333">
    <rect x="420" y="118" width="230" height="44" rx="6"/>
    <rect x="420" y="188" width="230" height="44" rx="6"/>
    <rect x="420" y="258" width="230" height="44" rx="6"/>
    <rect x="420" y="330" width="230" height="66" rx="6"/>
  </g>
  <g text-anchor="middle" font-family="monospace" fill="#123">
    <text x="535" y="145" font-size="14">Notebook</text>
    <text x="535" y="215" font-size="13">NotebookDirectory</text>
    <text x="535" y="285" font-size="14">NotebookPage</text>
    <text x="535" y="358" font-size="12">TextEntry &#183; HeaderEntry</text>
    <text x="535" y="378" font-size="12">AttachmentEntry &#183; &#8230;</text>
  </g>

  <!-- concept access hint -->
  <text x="535" y="132" text-anchor="middle" font-size="10" fill="#557" font-family="sans-serif">via user.notebooks[name]</text>

  <!-- vertical contains-arrows, left -->
  <g stroke="#333" stroke-width="1.3">
    <line x1="150" y1="162" x2="150" y2="186" marker-end="url(#arrow)"/>
    <line x1="150" y1="232" x2="150" y2="256" marker-end="url(#arrow)"/>
    <line x1="150" y1="302" x2="150" y2="328" marker-end="url(#arrow)"/>
    <path d="M70,219 C35,219 35,201 68,201" fill="none" marker-end="url(#arrow)"/>
  </g>
  <!-- vertical contains-arrows, right -->
  <g stroke="#333" stroke-width="1.3">
    <line x1="535" y1="162" x2="535" y2="186" marker-end="url(#arrow)"/>
    <line x1="535" y1="232" x2="535" y2="256" marker-end="url(#arrow)"/>
    <line x1="535" y1="302" x2="535" y2="328" marker-end="url(#arrow)"/>
    <path d="M650,219 C685,219 685,201 652,201" fill="none" marker-end="url(#arrow)"/>
  </g>

  <text x="44" y="193" text-anchor="middle" font-size="10" fill="#555">nested</text>
  <text x="676" y="193" text-anchor="middle" font-size="10" fill="#555">nested</text>

  <!-- dashed mapping connectors -->
  <g stroke="#888" stroke-width="1.2" stroke-dasharray="5,4">
    <line x1="230" y1="140" x2="420" y2="140"/>
    <line x1="230" y1="210" x2="420" y2="210"/>
    <line x1="230" y1="280" x2="420" y2="280"/>
    <line x1="230" y1="360" x2="420" y2="360"/>
  </g>

  <text x="350" y="430" text-anchor="middle" font-size="12" fill="#555">Folders can contain folders or pages; pages contain entries</text>
</svg>
